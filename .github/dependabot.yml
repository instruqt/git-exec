version: 2
registries:
  instruqt-github:
    type: "git"
    url: "https://github.com"
    username: "x-access-token"
    password: "${{secrets.DEPENDABOT_KEY}}"

updates:
  - package-ecosystem: "gomod"
    registries:
      - "instruqt-github"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 30
    # Keep the release cooldown for third-party modules, but pick up our own
    # releases immediately.
    cooldown:
      default-days: 3
      exclude:
        - "go.instruqt.com/*"
    groups:
      patch-updates-security:
        applies-to: "security-updates"
        update-types: ["patch"]
      minor-updates-security:
        applies-to: "security-updates"
        update-types: ["minor"]
      # All OTel packages must move together — mixing SDK and exporter versions
      # that embed different semconv schema URLs breaks startup with
      # "conflicting Schema URL" errors. This applies to both go.opentelemetry.io
      # and go.opentelemetry.io/contrib packages.
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
          - "go.opentelemetry.io/contrib/*"
        update-types: ["minor", "patch"]
      patch-updates:
        update-types: ["patch"]
        exclude-patterns:
          - "go.opentelemetry.io/*"
          - "go.opentelemetry.io/contrib/*"
      minor-updates:
        update-types: ["minor"]
        exclude-patterns:
          - "go.opentelemetry.io/*"
          - "go.opentelemetry.io/contrib/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 30
    groups:
      patch-updates-security:
        applies-to: "security-updates"
        update-types: ["patch"]
      minor-updates-security:
        applies-to: "security-updates"
        update-types: ["minor"]
      patch-updates:
        update-types: ["patch"]
      minor-updates:
        update-types: ["minor"]


